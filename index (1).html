<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#eef3f9;--card:#fff;--ink:#14233b;--mut:#6b7a90;--navy:#12376b;--blue:#2563c9;--grn:#1f9d6b;--org:#e08a1e;--red:#d83a3a;--line:#dbe3ee;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0d1626;--card:#16233a;--ink:#e8eef8;--mut:#93a3bb;--navy:#0b2a57;--line:#2a3b58}}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 'Noto Sans Thai',system-ui,sans-serif}
#app{max-width:440px;margin:0 auto;min-height:100vh;padding-bottom:72px}
header{background:var(--navy);color:#fff;padding:14px 16px;position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
header b{font-size:18px}header small{display:block;opacity:.8;font-size:12px}
.back{background:none;border:0;color:#fff;font-size:20px;margin-right:8px;cursor:pointer}
main{padding:14px}.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:12px}
h3{margin:0 0 8px;font-size:15px}.row{display:flex;gap:8px;align-items:center}.sp{justify-content:space-between}
.btn{border:0;border-radius:10px;padding:11px 14px;font:inherit;font-weight:700;cursor:pointer;background:var(--blue);color:#fff}
.btn.g{background:var(--grn)}.btn.o{background:none;color:var(--blue);border:1.5px solid var(--blue)}.btn.w{width:100%}.btn:disabled{opacity:.4;cursor:not-allowed}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.stat{text-align:center;border-radius:10px;padding:10px 4px;font-size:12px}.stat b{display:block;font-size:20px}
label{display:block;font-size:12px;color:var(--mut);margin:8px 0 3px}
input,select,textarea{width:100%;padding:9px;border:1px solid var(--line);border-radius:8px;font:inherit;background:var(--card);color:var(--ink)}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:8px}.pt{cursor:pointer}.tag{font-size:12px;padding:2px 8px;border-radius:99px;color:#fff;background:var(--grn)}
.tabs{display:flex;gap:4px;overflow-x:auto;margin-bottom:10px}.tab{flex:none;padding:8px 12px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:inherit;font-size:13px;cursor:pointer}
.tab.on{background:var(--navy);color:#fff;border-color:var(--navy)}.chip{flex:none;padding:6px 11px;border-radius:99px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:inherit;font-size:13px;cursor:pointer}
.chip.on{background:var(--blue);color:#fff;border-color:var(--blue)}
nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:440px;background:var(--card);border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom,0px)}
nav button{flex:1;background:none;border:0;padding:10px 0;color:var(--mut);font:inherit;font-size:12px;cursor:pointer}nav button.on{color:var(--blue);font-weight:700}
.alert{background:#fde8e8;color:#9b1c1c;border-radius:10px;padding:10px;font-weight:700;margin-bottom:10px}
.tl{border-left:3px solid var(--line);margin-left:6px;padding-left:12px}.tl div{margin-bottom:12px}
.sb{display:flex;gap:8px;margin-bottom:8px}.sb i{flex:none;width:34px;height:34px;border-radius:8px;color:#fff;display:grid;place-items:center;font-style:normal;font-weight:700}
.sb textarea{min-height:64px}svg{width:100%;height:auto}.donut{width:130px;height:130px;border-radius:50%}
.toast{position:fixed;top:12px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;z-index:9;max-width:90%}
</style></head><body><div id="app"></div>
<script>
const DX=['Sepsis','Trauma','Stroke','Cardiac','อื่น ๆ'],COL=['#2563c9','#e08a1e','#7a5cd6','#1f9d6b','#9aa7ba'],MAX=10;
const blank=(t)=>({t:t||tm(),sbp:'',dbp:'',hr:'',sp:'',rr:'',tp:'',pain:'',o2:'',e:4,v:5,m:6,sym:'',help:'',res:''});

const S={view:'home',tab:'assess',cur:null,ai:0,toast:'',
pts:[{hn:'123456',dx:'Sepsis',ward:'sw.เพชรบุรี',st:'กำลังนำส่ง',age:45,sex:'ชาย',hist:'DM, HT',alg:'Amoxicillin (ผื่น)',meds:'IV Fluid, Ceftriaxone',labs:'CBC, BUN, Cr, Lactate',
A:[{t:'14:00',sbp:120,dbp:80,hr:98,sp:96,rr:20,tp:36.8,pain:2,o2:'O2 mask 5 L/min',e:4,v:5,m:6,sym:'ไข้ หนาวสั่น',help:'',res:''},{t:'14:20',sbp:118,dbp:76,hr:102,sp:92,rr:22,tp:37.4,pain:2,o2:'O2 mask 5 L/min',e:4,v:5,m:6,sym:'',help:'',res:''},{t:'14:40',sbp:112,dbp:72,hr:108,sp:89,rr:24,tp:37.6,pain:3,o2:'O2 mask 10 L/min',e:4,v:5,m:6,sym:'หายใจเหนื่อย',help:'เพิ่ม O2',res:'SpO2 94%'}],
ev:[{t:'10:00',x:'ผู้ป่วยออกเดินทาง ให้ O2 5 L/min'},{t:'10:35',x:'SpO2 ลดลงเหลือ 89% เพิ่ม O2 เป็น 10 L/min'}],sbar:{s:'',b:'',a:'',r:''}},
{hn:'234567',dx:'Trauma',ward:'sw.หัวหิน',st:'กำลังนำส่ง',age:32,sex:'ชาย',hist:'-',alg:'-',meds:'-',labs:'-',A:[{...blank('13:50'),sbp:130,dbp:85,hr:90,sp:97}],ev:[],sbar:{s:'',b:'',a:'',r:''}},
{hn:'345678',dx:'Stroke',ward:'sw.ประจวบฯ',st:'รอการนำส่ง',age:67,sex:'หญิง',hist:'HT',alg:'-',meds:'-',labs:'-',A:[{...blank('12:30'),sbp:160,dbp:95,hr:80,sp:95}],ev:[],sbar:{s:'',b:'',a:'',r:''}},
{hn:'456789',dx:'Cardiac',ward:'sw.ชะอำ',st:'ส่งมอบแล้ว',age:58,sex:'ชาย',hist:'-',alg:'-',meds:'-',labs:'-',A:[blank('09:00')],ev:[],sbar:{s:'',b:'',a:'',r:''}}]};
const KEY='ertc_v1';S.pts=[];S.hosp=['รพ.เพชรบุรี','รพ.หัวหิน','รพ.ประจวบคีรีขันธ์','รพ.ชะอำ'];function newDraft(){return{nocase:false,hn:'',name:'',age:'',sex:'ชาย',dx:'',hosp:'',rs:[],type:'Refer',rbReason:'',shift:'',sdate:'',nER:'',nWD:'',oER:'',oWD:'',drv:''}}function todayISO(){const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}function autoShift(){const h=new Date().getHours();return h>=8&&h<16?'เช้า':h>=16?'บ่าย':'ดึก'}function esc(s){return String(s).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;')}function pick(k,v,l){const d=S.draft;if(l&&S.ed&&S.ed[l]){S[l]=S[l].filter(y=>y!=v);({erL:['nER','oER'],wdL:['nWD','oWD'],drvs:['drv']}[l]||[]).forEach(q=>{if(d[q]==v)d[q]=''});render();return}d[k]=d[k]==v?'':v;render()}function tgE(l){S.ed=S.ed||{};S.ed[l]=!S.ed[l];render()}function chips2(l,k,ph){const d=S.draft,ed=S.ed&&S.ed[l];return `<div style="display:flex;flex-wrap:wrap;gap:6px">${S[l].map(x=>`<button class="chip ${!ed&&d[k]==x?'on':''}" style="${ed?'border-color:var(--red);color:var(--red)':''}" data-v="${esc(x)}" onclick="pick('${k}',this.dataset.v,'${l}')">${esc(x)}${ed?' ✕':''}</button>`).join('')||'<small style="color:var(--mut)">ยังไม่มีรายชื่อ พิมพ์เพิ่มด้านล่าง</small>'}</div><div class="row" style="margin-top:8px"><input id="n_${k}" placeholder="${ph}"><button class="btn o" style="flex:none" onclick="addN('${l}','${k}')">+ เพิ่ม</button><button class="btn o" style="flex:none;${ed?'background:var(--red);color:#fff;border-color:var(--red)':''}" onclick="tgE('${l}')">${ed?'เสร็จ':'ลบชื่อ'}</button></div>`}function info(p){if(!p.shift)return'';const r=(a,b)=>`<div>${a}: <b>${esc(b||'-')}</b></div>`;return `<div class="card" style="font-size:13px"><div class="row sp"><b>เวร${p.shift} · ${p.sdate}</b><span class="tag" style="background:${p.type=='Refer back'?'var(--org)':'var(--blue)'}">${p.type||'Refer'}</span></div>${p.rbReason?'<div>'+esc(p.rbReason)+'</div>':''}<div class="g2" style="margin-top:6px">${r('ER เจ้าของเวร',p.nER||p.nurse)}${r('Ward เจ้าของเวร',p.nWD)}${r('ER ปฏิบัติงาน',p.oER)}${r('Ward ปฏิบัติงาน',p.oWD)}</div>${r('พขร.',p.drv)}</div>`}function addN(l,k){const v=document.getElementById('n_'+k).value.trim();if(!v)return;if(!S[l].includes(v))S[l].push(v);const d=S.draft;if(Array.isArray(d[k])){if(!d[k].includes(v))d[k].push(v)}else d[k]=v;render()}function chipsH(l,k,ph){const d=S.draft,on=x=>Array.isArray(d[k])?d[k].includes(x):d[k]==x;return `<div style="display:flex;flex-wrap:wrap;gap:6px">${S[l].map(x=>`<button class="chip ${on(x)?'on':''}" data-v="${esc(x)}" onclick="pick('${k}',this.dataset.v)">${esc(x)}</button>`).join('')||'<small style="color:var(--mut)">ยังไม่มีรายชื่อ พิมพ์เพิ่มด้านล่าง</small>'}</div><div class="row" style="margin-top:8px"><input id="n_${k}" placeholder="${ph}"><button class="btn o" style="flex:none" onclick="addN('${l}','${k}')">+ เพิ่ม</button></div>`}S.draft=newDraft();S.erL=[];S.wdL=[];S.drvs=[];try{const j=JSON.parse(localStorage.getItem(KEY)||'null');if(j)Object.assign(S,j)}catch(e){}S.draft=Object.assign(newDraft(),S.draft);S.erL=S.erL||[];S.wdL=S.wdL||[];S.drvs=S.drvs||[];var RD=null,SYNC='connecting';function syncTxt(){return SYNC=='on'?'เชื่อมต่อแล้ว (ทุกเครื่องเห็นเหมือนกัน)':SYNC=='connecting'?'กำลังเชื่อมต่อ...':SYNC=='error'?'เชื่อมต่อไม่ได้ ใช้รายชื่อในเครื่องนี้':'ใช้รายชื่อในเครื่องนี้'}function sel2(l,k,who){const d=S.draft,list=S[l],ed=S.ed&&S.ed[k];return `<select onchange="dr('${k}',this.value)"><option value="">เลือกชื่อ</option>${list.map(x=>`<option value="${esc(x)}" ${d[k]==x?'selected':''}>${esc(x)}</option>`).join('')}</select>${list.length?'':'<small style="color:var(--mut)">ยังไม่มีรายชื่อ กดปุ่มด้านล่างเพื่อเพิ่ม (ทุกเครื่องจะเห็นเหมือนกัน)</small>'}<button class="btn o w" style="margin-top:8px" onclick="tgE('${k}')">✏️ เพิ่ม/ลดรายชื่อ (${who})</button>${ed?mng(l,k):''}`}function mng(l,k){return `<div class="card" style="margin-top:8px;background:var(--bg)"><div class="row"><input id="mn_${k}" placeholder="พิมพ์ชื่อที่จะเพิ่ม"><button class="btn" style="flex:none" onclick="addR('${l}','${k}')">+ เพิ่ม</button></div>${S[l].map((x,i)=>`<div class="row sp" style="margin-top:6px"><span>${esc(x)}</span><button class="btn o" style="flex:none;padding:4px 10px;color:var(--red);border-color:var(--red)" onclick="delR('${l}','${k}',${i})">ลบ</button></div>`).join('')}<button class="btn w" style="margin-top:8px" onclick="tgE('${k}')">เสร็จ</button></div>`}function saveR(l,arr){S[l]=arr;render();api({action:'setRoster',type:l,names:arr})}function addR(l,k){const v=document.getElementById('mn_'+k).value.trim();if(!v||S[l].includes(v))return;S.draft[k]=v;saveR(l,[...S[l],v])}function delR(l,k,i){const v=S[l][i];({erL:['nER','oER'],wdL:['nWD','oWD'],drvs:['drv']}[l]||[]).forEach(q=>{if(S.draft[q]==v)S.draft[q]=''});saveR(l,S[l].filter((_,j)=>j!=i))}if(!['assess','chart','ev'].includes(S.tab))S.tab='assess';if(S.view=='pt'&&!S.pts[S.cur])S.view='home';if(S.view=='pt'&&!S.pts[S.cur].A[S.ai])S.ai=0;function persist(){try{localStorage.setItem(KEY,JSON.stringify({pts:S.pts,hosp:S.hosp,erL:S.erL,wdL:S.wdL,drvs:S.drvs,draft:S.draft,view:S.view,tab:S.tab,cur:S.cur,ai:S.ai}))}catch(e){}}function dr(k,v){S.draft[k]=v;persist()}function pickH(h){S.draft.hosp=h;render()}function addH(){const v=document.getElementById('nh').value.trim();if(!v)return;if(!S.hosp.includes(v))S.hosp.push(v);S.draft.hosp=v;render()}function tgR(x){const r=S.draft.rs,i=r.indexOf(x);i<0?r.push(x):r.splice(i,1);persist()}addEventListener('pagehide',persist);document.addEventListener('visibilitychange',persist);
const P=()=>S.pts[S.cur],A=()=>P().A[S.ai],last=p=>p.A[p.A.length-1];
const stC={'กำลังนำส่ง':'var(--grn)','รอการนำส่ง':'var(--org)','ส่งมอบแล้ว':'var(--blue)'};
function go(v,i){S.view=v;if(i!==undefined){S.cur=i;S.ai=P().A.length-1;S.tab='assess'}render()}
function toast(m){S.toast=m;render();setTimeout(()=>{S.toast='';render()},2200)}
function set(k,v){A()[k]=v;persist()}function setP(k,v){P()[k]=v;persist()}function setS(k,v){P().sbar[k]=v;persist()}
function addA(){if(P().A.length>=MAX)return;api({action:'saveAssessment',cid:P().id,hn:P().hn,seq:S.ai+1,a:A()});P().A.push(blank());S.ai=P().A.length-1;render()}
function addEv(){const t=document.getElementById('et').value,x=document.getElementById('ex').value;if(!x)return;P().ev.push({t:t||tm(),x});api({action:'addEvent',cid:P().id,hn:P().hn,t:t||tm(),x},'บันทึกเหตุการณ์ลง Sheets แล้ว ✓');P().ev.sort((a,b)=>a.t<b.t?-1:1);render()}
function reg(){const d=S.draft;if(d.nocase){if(!d.nER||!d.nWD){toast('เลือก ER และ Ward เจ้าของเวรก่อน');return}api({action:'addPatient',p:{id:'C'+Date.now(),status:'ไม่มีเคส',hn:'-',name:'ไม่มีเคส',dx:'ไม่มีเคส',ward:'-',type:'ไม่มีเคส',reasons:[],shift:d.shift||autoShift(),sdate:d.sdate||todayISO(),nER:d.nER,nWD:d.nWD,oER:d.oER,oWD:d.oWD,drv:d.drv}},'บันทึกเวร (ไม่มีเคส) ลง Sheets แล้ว ✓');S.draft=newDraft();go('home');toast('บันทึกเวร (ไม่มีเคส) แล้ว');return}if(!d.hn||!d.name||!d.dx||!d.hosp||!d.nER||!d.nWD){toast('กรอก HN ชื่อ-นามสกุล การวินิจฉัย เลือก รพ.ปลายทาง และชื่อ ER/Ward เจ้าของเวรก่อน');return}
S.pts.unshift({id:'C'+Date.now(),hn:d.hn,name:d.name,dx:d.dx,ward:d.hosp,reasons:d.rs.slice(),type:d.type,rbReason:d.rbReason,shift:d.shift||autoShift(),sdate:d.sdate||todayISO(),nER:d.nER,nWD:d.nWD,oER:d.oER,oWD:d.oWD,drv:d.drv,st:'รอการนำส่ง',age:d.age,sex:d.sex,hist:'',alg:'',meds:'',labs:'',A:[blank()],ev:[],sbar:{s:'',b:'',a:'',r:''}});api({action:'addPatient',p:S.pts[0]},'ลงทะเบียนลง Sheets แล้ว ✓');S.draft=newDraft();go('pt',0);toast('ลงทะเบียนแล้ว')}
function save(){const a=A();api({action:'saveAssessment',cid:P().id,hn:P().hn,seq:S.ai+1,a},'บันทึกลง Sheets แล้ว ✓ (ประเมินครั้งที่ '+(S.ai+1)+')');toast('บันทึกการประเมินครั้งที่ '+(S.ai+1)+' แล้ว'+(a.sp!==''&&a.sp<90?' · แจ้งเตือน SpO2 < 90%':''))}
function inp(l,k,u){return `<div><label>${l}</label><input value="${A()[k]}" ${u?'type=number step=any':''} oninput="set('${k}',this.value)"></div>`}
function home(){const c=s=>S.pts.filter(p=>p.st==s).length;
return `<header><b>ER Transfer Care</b><small>โรงพยาบาลชะอำ · ${new Date().toLocaleDateString('th-TH',{day:'numeric',month:'short',year:'numeric'})}</small></header><main>
<button class="btn g w" onclick="go('reg')">+ ลงทะเบียนส่งต่อผู้ป่วย</button><div class="stats" style="margin:12px 0">
<div class="stat" style="background:#e3eefc"><b>${c('กำลังนำส่ง')}</b>กำลังส่งต่อ</div><div class="stat" style="background:#e2f5ec"><b>${c('ส่งมอบแล้ว')}</b>ส่งมอบแล้ว</div><div class="stat" style="background:#fdf0dd"><b>${c('รอการนำส่ง')}</b>รอการนำส่ง</div></div>
<h3>ผู้ป่วยที่กำลังส่งต่อ</h3>${list(S.pts.filter(p=>p.st!='ส่งมอบแล้ว'))}</main>`}
function list(a){return a.map(p=>{const l=last(p),w=l.sp!==''&&l.sp<90;return `<div class="card pt" onclick="go('pt',${S.pts.indexOf(p)})"><div class="row sp"><b>HN ${p.hn}${p.name?' · '+p.name:''}</b><span class="tag" style="background:${stC[p.st]}">${p.st}</span></div><div class="row sp"><span>${p.dx} · ${p.ward}</span><small style="color:var(--mut)">${l.t}</small></div>${w?'<div style="color:var(--red);font-size:13px;margin-top:4px">⚠ SpO2 '+l.sp+'%</div>':''}</div>`}).join('')}
function regv(){if(!S.draft.shift)S.draft.shift=autoShift();if(!S.draft.sdate)S.draft.sdate=todayISO();return `<header><div class="row"><button class="back" onclick="go('home')">‹</button><b>ลงทะเบียนส่งต่อผู้ป่วย</b></div></header><main><div class="card">
<div style="display:flex;gap:6px;margin-bottom:6px">${[['มีเคส',false],['ไม่มีเคส',true]].map(x=>`<button class="chip ${!!S.draft.nocase==x[1]?'on':''}" style="flex:1" onclick="dr('nocase',${x[1]});render()">${x[0]}</button>`).join('')}</div>${S.draft.nocase?'<small style="color:var(--mut)">ไม่มีเคส: ลงชื่อเจ้าหน้าที่ประจำเวรอย่างเดียว ไม่ต้องกรอกข้อมูลผู้ป่วย</small>':''}<label>เวรที่ทำการ refer *</label><div class="g2" style="grid-template-columns:1fr 135px"><div style="display:flex;gap:6px">${['เช้า','บ่าย','ดึก'].map(x=>`<button class="chip ${S.draft.shift==x?'on':''}" style="flex:1" onclick="dr('shift','${x}');render()">เวร${x}</button>`).join('')}</div><input type=date value="${S.draft.sdate}" oninput="dr('sdate',this.value)"></div><small style="color:var(--mut)">เช้า 08–16 · บ่าย 16–24 · ดึก 00–08 (เลือกตามเวลาปัจจุบันให้อัตโนมัติ แก้ได้)</small>${S.draft.nocase?'':`<label>HN *</label><input value="${S.draft.hn}" placeholder="กรอก HN" oninput="dr('hn',this.value)"><label>ชื่อ-นามสกุล *</label><input value="${S.draft.name}" placeholder="กรอกชื่อ-นามสกุล" oninput="dr('name',this.value)"><div class="g2"><div><label>อายุ</label><input type=number value="${S.draft.age}" oninput="dr('age',this.value)"></div><div><label>เพศ</label><div style="display:flex;gap:6px">${['ชาย','หญิง'].map(x=>`<button class="chip ${S.draft.sex==x?'on':''}" style="flex:1" onclick="dr('sex','${x}');render()">${x}</button>`).join('')}</div></div></div>
<label>การวินิจฉัยเบื้องต้น *</label><input value="${S.draft.dx}" placeholder="พิมพ์การวินิจฉัย เช่น Sepsis, Trauma" oninput="dr('dx',this.value)">
<label>โรงพยาบาลปลายทาง * (กดเลือก)</label><div style="display:flex;flex-wrap:wrap;gap:6px">${S.hosp.map(h=>`<button class="chip ${S.draft.hosp==h?'on':''}" data-h="${h.replace(/"/g,'&quot;')}" onclick="pickH(this.dataset.h)">${h}</button>`).join('')}</div><div class="row" style="margin-top:8px"><input id=nh placeholder="เพิ่มชื่อ รพ. ใหม่"><button class="btn o" style="flex:none" onclick="addH()">+ เพิ่ม</button></div>
<label>ประเภทการส่งต่อ</label><div style="display:flex;gap:6px">${['Refer','Refer back'].map(x=>`<button class="chip ${S.draft.type==x?'on':''}" style="flex:1" onclick="dr('type','${x}');render()">${x}</button>`).join('')}</div>${S.draft.type=='Refer back'?`<label>เหตุผล / รายละเอียดการ refer back</label><input value="${esc(S.draft.rbReason)}" placeholder="เช่น อาการคงที่ ส่งกลับ รพ.ต้นทาง" oninput="dr('rbReason',this.value)">`:''}<label>เหตุผลในการส่งต่อ</label>${['เกินศักยภาพการรักษา','ต้องการแพทย์เฉพาะทาง','ต้องการตรวจวินิจฉัยเพิ่มเติม'].map(x=>`<div><input type=checkbox style="width:auto" ${S.draft.rs.includes(x)?'checked':''} onchange="tgR('${x}')"> ${x}</div>`).join('')}
`}<label>ER เจ้าของเวร *</label>${sel2('erL','nER','ER เจ้าของเวร')}<label>Ward เจ้าของเวร *</label>${sel2('wdL','nWD','Ward เจ้าของเวร')}<label>ER ปฏิบัติงาน</label>${sel2('erL','oER','ER ปฏิบัติงาน')}<label>Ward ปฏิบัติงาน</label>${sel2('wdL','oWD','Ward ปฏิบัติงาน')}<label>พขร.</label>${sel2('drvs','drv','พขร.')}<small style="color:var(--mut);display:block;margin-top:8px">สถานะซิงค์รายชื่อ: ${syncTxt()}</small><div class="g2" style="margin-top:12px"><button class="btn o" onclick="go('home')">ยกเลิก</button><button class="btn" onclick="reg()">${S.draft.nocase?'บันทึกเวร (ไม่มีเคส)':'ลงทะเบียน'}</button></div></div></main>`}
function ptv(){const p=P(),l=last(p),T=[['assess','ประเมิน'],['chart','กราฟ'],['ev','เหตุการณ์']];
let b='';if(S.tab=='assess')b=assess();if(S.tab=='chart')b=chart();if(S.tab=='ev')b=evv();
return `<header><div class="row"><button class="back" onclick="go('home')">‹</button><div><b>HN ${p.hn} · ${p.dx}</b><small>${p.name?p.name+' · ':''}${p.ward} · ${p.st}${p.type=='Refer back'?' · Refer back':''}</small></div></div></header><main>${info(p)}${l.sp!==''&&l.sp<90?'<div class="alert">⚠ แจ้งเตือน: SpO2 ต่ำกว่า 90% ('+l.sp+'%) กรุณาประเมินและให้ความช่วยเหลือทันที</div>':''}
<div class="tabs">${T.map(t=>`<button class="tab ${S.tab==t[0]?'on':''}" onclick="S.tab='${t[0]}';render()">${t[1]}</button>`).join('')}</div>${b}${endBtn(p)}</main>`}
function assess(){const p=P(),a=A(),n=p.A.length;
return `<div class="row sp" style="margin-bottom:8px"><b>การประเมิน ${n}/${MAX} ครั้ง</b><small style="color:var(--mut)">เหลือ ${MAX-n} ครั้ง</small></div>
<div class="tabs">${p.A.map((x,i)=>`<button class="chip ${i==S.ai?'on':''}" onclick="S.ai=${i};render()">ครั้งที่ ${i+1}</button>`).join('')}</div>
<div class="card"><div class="row sp"><h3 style="margin:0">สัญญาณชีพ · ครั้งที่ ${S.ai+1}</h3><div class="row" style="width:130px"><small>เวลา</small><input type=time value="${a.t}" oninput="set('t',this.value)"></div></div><div class="g2" style="margin-top:6px"><div><label>BP (mmHg)</label><div class="row"><input type=number placeholder="SBP" value="${a.sbp}" oninput="set('sbp',this.value)"><b>/</b><input type=number placeholder="DBP" value="${a.dbp}" oninput="set('dbp',this.value)"></div></div>${inp('HR (ครั้ง/นาที)','hr',1)}${inp('RR (ครั้ง/นาที)','rr',1)}${inp('SpO2 (%)','sp',1)}${inp('อุณหภูมิ Temp (°C)','tp',1)}<div><label>Pain score</label><select onchange="set('pain',this.value)"><option value="">เลือก</option>${Array.from({length:11},(_,i)=>`<option ${String(a.pain)===String(i)?'selected':''}>${i}</option>`).join('')}</select></div></div>
<label>GCS</label><div class="g2" style="grid-template-columns:repeat(3,1fr)">${inp('E','e',1)}${inp('V','v',1)}${inp('M','m',1)}</div>
<label>Oxygen / อุปกรณ์ช่วยหายใจ</label><input value="${a.o2}" oninput="set('o2',this.value)"><label>อาการปัจจุบัน</label><textarea oninput="set('sym',this.value)">${a.sym}</textarea>
<label>การช่วยเหลือที่ให้</label><textarea oninput="set('help',this.value)">${a.help}</textarea><label>ผลหลังให้ความช่วยเหลือ</label><textarea oninput="set('res',this.value)">${a.res}</textarea></div>
<div class="g2"><button class="btn" onclick="save()">บันทึก</button><button class="btn o" ${n>=MAX?'disabled title="ครบ 10 ครั้งแล้ว"':''} onclick="addA()">+ เพิ่มการประเมิน</button></div>${n>=MAX?'<small style="color:var(--org)">ครบ 10 ครั้งแล้ว เพิ่มไม่ได้อีก</small>':''}`}
function ln(vals,mn,mx,c){const W=320,H=90,pts=vals.map((v,i)=>v===''?null:[(vals.length<2?W/2:20+i*(W-40)/(vals.length-1)),H-8-(v-mn)/(mx-mn)*(H-16)]).filter(Boolean);return `<polyline fill="none" stroke="${c}" stroke-width="2" points="${pts.map(p=>p.join(',')).join(' ')}"/>`+pts.map(p=>`<circle cx="${p[0]}" cy="${p[1]}" r="3" fill="${c}"/>`).join('')}
function box(t,body,extra){return `<div class="card"><h3>${t}</h3><svg viewBox="0 0 320 90">${extra||''}${body}</svg></div>`}
function chart(){const A_=P().A,f=k=>A_.map(a=>a[k]);
return box('BP (mmHg) — ฟ้า SBP / แดง DBP',ln(f('sbp'),40,200,'#2563c9')+ln(f('dbp'),40,200,'#d83a3a'))+box('HR (ครั้ง/นาที)',ln(f('hr'),40,160,'#1f9d6b'))+box('SpO2 (%) — เส้นประ = 90%',ln(f('sp'),70,100,'#7a5cd6'),`<line x1=0 x2=320 y1=${90-8-(90-70)/30*74} y2=${90-8-(90-70)/30*74} stroke="#d83a3a" stroke-dasharray="4"/>`)+
`<div class="card"><h3>GCS</h3>${A_.map((a,i)=>`<div class="row sp"><span>ครั้งที่ ${i+1} · ${a.t}</span><span>E${a.e} V${a.v} M${a.m} = <b>${+a.e+ +a.v+ +a.m}</b></span></div>`).join('')}</div>`}
function evv(){const p=P();return `<div class="card"><div class="g2" style="grid-template-columns:90px 1fr"><input id=et type=time value="${tm()}"><input id=ex placeholder="บันทึกเหตุการณ์"></div><button class="btn w" style="margin-top:8px" onclick="addEv()">+ เพิ่มเหตุการณ์</button></div><div class="tl">${p.ev.length?p.ev.map(e=>`<div><b>${e.t}</b><br>${e.x}</div>`).join(''):'<small>ยังไม่มีเหตุการณ์ เพิ่มรายการแรกด้านบน</small>'}</div>`}
function sbar(){const p=P(),l=last(p),d=p.sbar,C=[['s','S','Situation','var(--red)','อาการปัจจุบัน / เหตุผลการส่งต่อ'],['b','B','Background','var(--blue)','ประวัติสำคัญ / การรักษาที่ให้'],['a','A','Assessment','var(--grn)','สัญญาณชีพล่าสุด / การเปลี่ยนแปลง'],['r','R','Recommendation','var(--org)','สิ่งที่ต้องดำเนินการต่อ']];
return `<div class="card">${C.map(c=>`<div class="sb"><i style="background:${c[3]}">${c[1]}</i><div style="flex:1"><b>${c[2]}</b><textarea placeholder="${c[4]}" oninput="setS('${c[0]}',this.value)">${d[c[0]]}</textarea></div></div>`).join('')}
<small style="color:var(--mut)">ล่าสุด ${l.t}: BP ${l.sbar||l.sbp}/${l.dbp} HR ${l.hr} SpO2 ${l.sp}%</small><label>ผู้ส่งมอบ</label><input placeholder="ชื่อ-สกุล / ตำแหน่ง"><div class="g2" style="margin-top:10px"><button class="btn" onclick="go('pt',S.cur);toast('บันทึก SBAR แล้ว')">บันทึก</button><button class="btn o" onclick="try{window.print()}catch(e){toast('พิมพ์ไม่ได้ในหน้านี้')}">สร้าง PDF</button></div></div>`}
function histv(){const p=P(),F=[['age','อายุ (ปี)'],['sex','เพศ'],['hist','โรคประจำตัว'],['alg','ประวัติแพ้ยา'],['meds','การรักษาที่ได้รับ'],['labs','ผลตรวจสำคัญ']];return `${p.nurse?`<div class="card"><h3>ข้อมูลการส่งต่อ</h3><div>${p.type||'Refer'}${p.rbReason?' · '+esc(p.rbReason):''}</div><div>เวร${p.shift} · ${p.sdate}</div><div>พยาบาลเจ้าของเวร: ${esc(p.nurse)}</div><div>ผู้ปฏิบัติงาน: ${esc((p.ops||[]).join(', ')||'-')}</div><div>พขร.: ${esc(p.drv||'-')}</div></div>`:''}<div class="card">${F.map(f=>`<label>${f[1]}</label><input value="${p[f[0]]}" oninput="setP('${f[0]}',this.value)">`).join('')}</div>`}
function plist(){return `<header><b>ผู้ป่วยทั้งหมด</b></header><main>${list(S.pts)}</main>`}
function rep(){const cat=p=>DX.find(d=>d!='อื่น ๆ'&&String(p.dx).toLowerCase().includes(d.toLowerCase()))||'อื่น ๆ';const n=S.pts.length,c=DX.map(d=>S.pts.filter(p=>cat(p)==d).length);let a=0;const g=c.map((v,i)=>{const s=a;a+=v/Math.max(n,1)*100;return COL[i]+' '+s+'% '+a+'%'}).join(',');
return `<header><b>รายงาน / สถิติ</b></header><main><div class="card row sp"><div><small>ผู้ป่วยทั้งหมด</small><br><b style="font-size:26px">${n} ราย</b></div><div><small>ส่งมอบแล้ว</small><br><b style="font-size:26px">${S.pts.filter(p=>p.st=='ส่งมอบแล้ว').length} ราย</b></div></div>
<div class="card"><h3>สถิติส่งต่อ (แยกตามการวินิจฉัย)</h3><div class="row"><div class="donut" style="background:conic-gradient(${g})"></div><div>${DX.map((d,i)=>`<div><span style="color:${COL[i]}">●</span> ${d} ${c[i]}</div>`).join('')}</div></div></div><button class="btn w" onclick="try{window.print()}catch(e){}">ดาวน์โหลดรายงาน (PDF)</button></main>`}
function setv(){return `<header><b>ตั้งค่า</b></header><main><div class="card"><div class="row sp"><span>ข้อมูลโรงพยาบาล</span>›</div><hr style="border-color:var(--line)"><div class="row sp"><span>บัญชีผู้ใช้งาน</span>›</div><hr style="border-color:var(--line)"><div class="row sp"><span>แจ้งเตือน (SpO2 &lt; 90%)</span><input type=checkbox checked style="width:auto"></div></div><small style="color:var(--mut)">ต้นแบบสำหรับทดสอบ ข้อมูลที่กรอกถูกบันทึกอัตโนมัติไว้ในเครื่องนี้ ปิดหรือออกจากหน้าแล้วเปิดใหม่ข้อมูลยังอยู่</small><button class="btn o w" style="margin-top:12px;color:var(--red);border-color:var(--red)" onclick="try{localStorage.removeItem(KEY)}catch(e){}location.reload()">ล้างข้อมูลที่บันทึกไว้</button></main>`}
function render(){persist();const v=S.view,m={home,reg:regv,pt:ptv,list:plist,rep,set:setv};const nv=v=='pt'||v=='reg'?'home':v;
document.getElementById('app').innerHTML=m[v]()+`<nav>${[['home','🏠','หน้าหลัก'],['list','👥','ผู้ป่วย'],['rep','📊','รายงาน'],['set','⚙️','ตั้งค่า']].map(x=>`<button class="${nv==x[0]?'on':''}" onclick="S.view='${x[0]}';render()">${x[1]}<br>${x[2]}</button>`).join('')}</nav>`+(S.toast?`<div class="toast">${S.toast}</div>`:'')}
render();
function endBtn(p){if(p.st=='ส่งมอบแล้ว')return `<div class="card" style="text-align:center;color:var(--grn)"><b>จบเคสแล้ว ✓</b><br><small>${p.endAt||''}</small></div><button class="btn o w" onclick="finish(true)">ส่งข้อมูลลง Sheets ซ้ำ</button>`;
return S.cf?`<div class="card" style="border-color:var(--red)"><b>ยืนยันจบเคส?</b><br><small>ส่งข้อมูลลงทะเบียน การประเมินทุกครั้ง และเหตุการณ์ทั้งหมดไปยัง Sheets</small><div class="g2" style="margin-top:8px"><button class="btn o" onclick="S.cf=false;render()">ยกเลิก</button><button class="btn g" onclick="finish()">ยืนยัน ส่งข้อมูล</button></div></div>`:`<button class="btn g w" style="margin-top:6px" onclick="S.cf=true;render()">✔ จบเคส / ส่งข้อมูล</button>`}
function finish(re){const p=P(),has=a=>['sbp','dbp','hr','rr','sp','tp','pain','o2','sym','help','res'].some(k=>a[k]!==''&&a[k]!=null);if(!p.id)p.id='L'+Date.now();if(!re){p.st='ส่งมอบแล้ว';p.endAt=new Date().toLocaleString('th-TH')}S.cf=false;toast('กำลังส่งข้อมูล...');api({action:'finishCase',cid:p.id,hn:p.hn,assessments:p.A.map((a,i)=>({...a,seq:i+1})).filter(has),events:p.ev},'จบเคสและส่งข้อมูลลง Sheets แล้ว ✓')}
const API_URL='วาง_URL_WEB_APP_ที่นี่',API_KEY='',LIFF_ID='';
function api(b,msg){if(!API_URL.startsWith('http')){if(msg)toast('ยังไม่ได้ตั้ง API_URL — ข้อมูลเก็บในเครื่องเท่านั้น');return}fetch(API_URL,{method:'POST',headers:{'Content-Type':'text/plain'},body:JSON.stringify({...b,key:API_KEY})}).then(r=>r.json()).then(x=>{if(x.error)throw 0;if(msg)toast(msg)}).catch(()=>{SYNC='error';toast('บันทึกลง Sheets ไม่สำเร็จ ตรวจสอบเน็ตหรือ URL')})}
function loadR(){if(!API_URL.startsWith('http')){SYNC='off';render();return}const o=JSON.stringify([S.erL,S.wdL,S.drvs])+SYNC;fetch(API_URL+'?key='+encodeURIComponent(API_KEY)).then(r=>r.json()).then(x=>{['erL','wdL','drvs'].forEach(k=>{if(Array.isArray(x[k]))S[k]=x[k]});SYNC='on'}).catch(()=>{SYNC='error'}).finally(()=>{const t=document.activeElement&&document.activeElement.tagName;if(o!=JSON.stringify([S.erL,S.wdL,S.drvs])+SYNC&&!['INPUT','SELECT','TEXTAREA'].includes(t))render()})}
if(LIFF_ID&&window.liff)liff.init({liffId:LIFF_ID}).catch(()=>{});loadR();setInterval(loadR,20000);
</script></body></html>
